<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chordify Web - Google Drive Audio Integration</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Circular+Std:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --font-scale: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Circular Std', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
            padding: 10px;
            gap: 10px;
        }

        /* Sidebar Kiri */
        .sidebar {
            width: 310px;
            background-color: #121212;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        body.fullscreen-mode .sidebar {
            display: none;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: #ffffff;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h2 i {
            color: #1db954;
        }

        .btn-add {
            background: #2a2a2a;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add:hover {
            background: #1db954;
            color: #000000;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .search-section label {
            font-size: 11px;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            color: #b3b3b3;
            font-size: 12px;
        }

        .search-box input {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 7px 12px 7px 32px;
            color: white;
            font-size: 12px;
            transition: 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #1db954;
        }

        .song-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .song-list::-webkit-scrollbar {
            width: 4px;
        }
        .song-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .song-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .song-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .song-item.active {
            background: rgba(29, 185, 84, 0.15);
            border-left: 3px solid #1db954;
        }

        .song-item-title {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
        }

        .song-item-artist {
            font-size: 11px;
            color: #b3b3b3;
        }

        .library-section, .queue-section {
            margin-top: 5px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .library-header, .queue-header {
            font-size: 11px;
            color: #1db954;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Area Utama Kanan */
        .main-content {
            flex: 1;
            background: linear-gradient(135deg, #1f3547 0%, #121212 50%);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .content-header {
            padding: 20px 32px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .song-info-banner {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .album-art-lg {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        .song-detail {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .song-detail-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .queue-nav-btn {
            background: #2a2a2a;
            color: #ffffff;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .queue-nav-btn:hover {
            background: #1db954;
            color: #000000;
        }

        .song-detail h1 {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-detail p {
            font-size: 12px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action-icon {
            background: #2a2a2a;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-action-icon:hover, .btn-action-icon.active {
            background: #1db954;
            color: black;
        }

        .transpose-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #b3b3b3;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .transpose-btn {
            background: #2a2a2a;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .transpose-btn:hover {
            background: #1db954;
            color: black;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
            color: #b3b3b3;
        }

        .toggle-switch input {
            accent-color: #1db954;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .player-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: #b3b3b3;
        }

        .btn-play-song {
            background: #1db954;
            color: black;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: transform 0.1s;
        }

        .btn-play-song:hover {
            transform: scale(1.1);
        }

        .extra-toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: #b3b3b3;
            flex-wrap: wrap;
        }

        .scroll-controls, .font-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .extra-toolbar input[type="range"] {
            -webkit-appearance: none;
            width: 90px;
            height: 6px;
            background: #2a2a2a;
            border-radius: 3px;
            outline: none;
        }

        .extra-toolbar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #1db954;
            cursor: pointer;
        }

        .scroll-controls span, .font-controls span {
            color: #1db954;
            font-weight: bold;
            min-width: 30px;
        }

        .viewport-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .viewport-body::-webkit-scrollbar {
            width: 6px;
        }
        .viewport-body::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .section-tag {
            display: inline-block;
            background: rgba(29, 185, 84, 0.15);
            color: #1db954;
            font-size: calc(11px * var(--font-scale));
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            margin-top: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lyric-line-wrapper {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background 0.2s, transform 0.2s;
        }

        .lyric-line-wrapper.active-lyric {
            background: rgba(29, 185, 84, 0.2);
            border-left: 4px solid #1db954;
            transform: scale(1.01);
        }

        .chords-row {
            font-family: 'Courier New', Courier, monospace;
            font-size: calc(18px * var(--font-scale));
            font-weight: 700;
            color: #1db954;
            white-space: pre;
            line-height: 1.3;
            margin-bottom: 3px;
        }

        .lyrics-row {
            font-family: 'Circular Std', sans-serif;
            font-size: calc(16px * var(--font-scale));
            line-height: 1.4;
            color: #ffffff;
            white-space: pre;
        }

        .hide-chords .chords-row {
            display: none !important;
        }

        /* Form Tambah/Edit Lagu */
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-container h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group textarea {
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
        }

        .form-group textarea {
            font-family: monospace;
            height: 220px;
            resize: vertical;
            line-height: 24px;
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 95%, rgba(255, 255, 255, 0.08) 95%);
            background-size: 100% 24px;
            background-attachment: local;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #1db954;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-submit {
            background: #1db954;
            color: #000000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-cancel {
            background: transparent;
            color: #b3b3b3;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-delete {
            background: rgba(255, 75, 75, 0.15);
            color: #ff4b4b;
            border: 1px solid rgba(255, 75, 75, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            margin-left: auto;
        }

        .btn-mobile-menu {
            display: none;
            background: #2a2a2a;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        @media screen and (max-width: 768px) {
            body {
                flex-direction: column;
                padding: 5px;
                height: 100vh;
                overflow: auto;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: -100%;
                width: 85%;
                height: 100%;
                z-index: 1000;
                box-shadow: 5px 0 15px rgba(0,0,0,0.8);
                transition: left 0.3s ease;
            }

            .sidebar.mobile-open {
                left: 0;
            }

            .btn-mobile-menu {
                display: flex;
            }

            .main-content {
                height: 100%;
                width: 100%;
            }

            .content-header {
                padding: 12px 16px;
            }

            .viewport-body {
                padding: 16px;
            }
        }
    </style>
</head>
<body id="mainBody">

    <!-- Audio Element -->
    <audio id="localAudioPlayer" style="display:none;"></audio>

    <!-- Sidebar Kiri -->
    <div class="sidebar" id="appSidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-music"></i> Koleksi</h2>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="btn-add" onclick="showAddForm(); toggleMobileSidebar()"><i class="fa-solid fa-plus"></i> Tambah</button>
                <button class="btn-mobile-menu" onclick="toggleMobileSidebar()" style="background: transparent; font-size: 20px;"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <div class="search-section">
            <label><i class="fa-solid fa-microphone-lines"></i> Judul / Artis</label>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchMetaInput" placeholder="Cari judul atau artis..." oninput="renderSidebar()">
            </div>
        </div>
        <div class="song-list" id="songListContainer" style="display: none;"></div>

        <div class="search-section">
            <label><i class="fa-solid fa-file-lines"></i> Kata dalam Lirik</label>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchLyricInput" placeholder="Cari kata/kalimat di lirik..." oninput="renderSidebar()">
            </div>
        </div>
        <div class="song-list" id="lyricListContainer" style="display: none;"></div>

        <div class="library-section">
            <div class="library-header">
                <span><i class="fa-solid fa-book-open"></i> Library (Abjad A-Z)</span>
                <span id="libraryCount" style="font-weight: normal; color: #b3b3b3; font-size: 10px;">0 lagu</span>
            </div>
            <div class="search-box" style="margin-top: 4px;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchLibraryInput" placeholder="Filter library abjad..." oninput="renderSidebar()">
            </div>
            <div class="song-list" id="libraryListContainer" style="display: none; max-height: 160px; margin-top: 4px;"></div>
        </div>

        <div class="queue-section">
            <div class="queue-header">
                <span><i class="fa-solid fa-list-ul"></i> Sedang Diputar (Queue)</span>
                <span id="queueCount" style="font-weight: normal; color: #b3b3b3; font-size: 10px;">0 lagu</span>
            </div>
            <div class="song-list" id="queueListContainer" style="max-height: 130px;"></div>
        </div>
    </div>

    <!-- Area Kanan -->
    <div class="main-content">
        <div class="content-header" id="contentHeader">
            <div class="header-top-row">
                <div class="song-info-banner">
                    <button class="btn-mobile-menu" onclick="toggleMobileSidebar()" title="Buka Daftar Lagu"><i class="fa-solid fa-bars"></i></button>
                    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" alt="Art" class="album-art-lg">
                    <div class="song-detail">
                        <div class="song-detail-top">
                            <button class="queue-nav-btn" onclick="playPrevQueue()" title="Lagu Sebelumnya"><i class="fa-solid fa-backward-step"></i></button>
                            <h1 id="displayTitle">Judul Lagu</h1>
                            <button class="queue-nav-btn" onclick="playNextQueue()" title="Lagu Berikutnya"><i class="fa-solid fa-forward-step"></i></button>
                        </div>
                        <p id="displayArtist">Nama Artis</p>
                    </div>
                </div>
                <div class="control-actions">
                    <button class="btn-action-icon" id="btnFullscreen" title="Mode Layar Penuh" onclick="toggleFullscreen()"><i class="fa-solid fa-expand"></i></button>
                    <button class="btn-action-icon" title="Edit Lagu Ini" onclick="showEditForm()"><i class="fa-solid fa-pen-to-square"></i></button>
                    <div class="transpose-group">
                        <span>Key:</span>
                        <button class="transpose-btn" onclick="transpose(-1)">-</button>
                        <span id="keyDisplay" style="font-weight: bold; color: #1db954;">C</span>
                        <button class="transpose-btn" onclick="transpose(1)">+</button>
                    </div>
                    
                    <label class="toggle-switch">
                        <input type="checkbox" id="numberFormatToggle" onchange="renderPlayer()">
                        <span>Angka</span>
                    </label>

                    <label class="toggle-switch">
                        <input type="checkbox" id="chordToggle" checked onchange="toggleChords()">
                        <span>Chord</span>
                    </label>
                </div>
            </div>

            <!-- Pemutar Musik -->
            <div class="player-bar" id="playerBarContainer">
                <button class="btn-play-song" id="btnPlayAudio" onclick="togglePlayMusic()"><i class="fa-solid fa-play" id="playIcon"></i></button>
                <span id="audioStatusText" style="font-weight: 600; color: #fff;">Putar Audio Google Drive</span>
                <span id="songCurrentTime" style="margin-left: auto;">00:00</span>
                <span>/</span>
                <span id="songDuration">00:00</span>
            </div>

            <!-- Toolbar Fitur Tambahan -->
            <div class="extra-toolbar">
                <div class="scroll-controls">
                    <i class="fa-solid fa-arrow-down-long" style="color: #1db954;"></i>
                    <span>Auto Scroll:</span>
                    <input type="range" id="scrollSpeedRange" min="0.5" max="5.0" step="0.5" value="1.0" oninput="updateScrollSpeedFromSlider(this.value)">
                    <span id="scrollSpeedDisplay">1.0x</span>
                    <button id="btnToggleScroll" onclick="toggleAutoScroll()" style="background: #1db954; color: black; padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px;">Mulai</button>
                </div>

                <div class="font-controls" style="margin-left: auto;">
                    <i class="fa-solid fa-text-height" style="color: #1db954;"></i>
                    <span>Ukuran Font:</span>
                    <input type="range" id="fontSizeRange" min="0.7" max="1.8" step="0.1" value="1.0" oninput="updateFontSizeFromSlider(this.value)">
                    <span id="fontSizeDisplay">100%</span>
                </div>
            </div>
        </div>

        <div class="viewport-body" id="viewportBody"></div>
    </div>

    <script>
        let songList = JSON.parse(localStorage.getItem('web_saved_songs')) || [
            {
                title: "Here Again (Contoh GDrive)",
                artist: "Elevation Worship",
                audioPath: "", 
                rawText: 
`[Verse 1]
[C       G/B    Am]
Can't go back to the beginning
[F       C      G]
Can't unsee what I've seen`
            }
        ];

        let currentSongIndex = 0;
        let queueList = []; 
        let currentQueueIndex = -1; 

        const chordList = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        let currentKeyIndex = 0;
        let isEditing = false;

        let audioPlayer = document.getElementById('localAudioPlayer');
        let syncInterval = null;

        let animationId = null;
        let lastScrollTime = 0;
        let accumulatedScroll = 0;
        let scrollSpeed = 1.0; 
        let isScrolling = false;
        let fontScale = 1.0;

        // Fungsi konversi link Google Drive yang disempurnakan dengan &confirm=t
        function parseGoogleDriveUrl(url) {
            if (!url) return '';
            let cleanUrl = url.trim();
            let fileId = '';
            
            let match1 = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match1 && match1[1]) {
                fileId = match1[1];
            }
            
            if (!fileId) {
                let match2 = cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match2 && match2[1]) {
                    fileId = match2[1];
                }
            }
            
            if (fileId) {
                return `https://docs.google.com/uc?export=download&confirm=t&id=${fileId}`;
            }
            
            return cleanUrl;
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('appSidebar');
            sidebar.classList.toggle('mobile-open');
        }

        function renderSidebar() {
            const metaContainer = document.getElementById('songListContainer');
            const lyricContainer = document.getElementById('lyricListContainer');
            const libraryContainer = document.getElementById('libraryListContainer');
            
            const metaKeyword = document.getElementById('searchMetaInput').value.toLowerCase().trim();
            const lyricKeyword = document.getElementById('searchLyricInput').value.toLowerCase().trim();
            const libraryKeyword = document.getElementById('searchLibraryInput').value.toLowerCase().trim();
            
            metaContainer.innerHTML = '';
            if (metaKeyword === '') {
                metaContainer.style.display = 'none';
            } else {
                metaContainer.style.display = 'flex';
                songList.forEach((song, index) => {
                    if (song.title.toLowerCase().includes(metaKeyword) || song.artist.toLowerCase().includes(metaKeyword)) {
                        const item = document.createElement('div');
                        item.className = `song-item ${index === currentSongIndex && !isEditing ? 'active' : ''}`;
                        item.onclick = () => { selectSong(index, true); if(window.innerWidth <= 768) toggleMobileSidebar(); };
                        item.innerHTML = `<div class="song-item-title">${song.title}</div><div class="song-item-artist">${song.artist}</div>`;
                        metaContainer.appendChild(item);
                    }
                });
            }

            lyricContainer.innerHTML = '';
            if (lyricKeyword === '') {
                lyricContainer.style.display = 'none';
            } else {
                lyricContainer.style.display = 'flex';
                songList.forEach((song, index) => {
                    if (song.rawText.toLowerCase().includes(lyricKeyword)) {
                        const item = document.createElement('div');
                        item.className = `song-item ${index === currentSongIndex && !isEditing ? 'active' : ''}`;
                        item.onclick = () => { selectSong(index, true); if(window.innerWidth <= 768) toggleMobileSidebar(); };
                        item.innerHTML = `<div class="song-item-title">${song.title}</div><div class="song-item-artist">${song.artist}</div>`;
                        lyricContainer.appendChild(item);
                    }
                });
            }

            libraryContainer.innerHTML = '';
            if (libraryKeyword === '') {
                libraryContainer.style.display = 'none';
                document.getElementById('libraryCount').innerText = '0 lagu';
            } else {
                libraryContainer.style.display = 'flex';
                let indexedSongs = songList.map((song, idx) => ({ ...song, originalIndex: idx }));
                indexedSongs.sort((a, b) => a.title.localeCompare(b.title, 'id', { sensitivity: 'base' }));

                let filteredLibrary = indexedSongs.filter(song => 
                    song.title.toLowerCase().includes(libraryKeyword) || song.artist.toLowerCase().includes(libraryKeyword)
                );

                document.getElementById('libraryCount').innerText = filteredLibrary.length + ' lagu';
                let limitedLibrary = filteredLibrary.slice(0, 5);

                if (limitedLibrary.length === 0) {
                    libraryContainer.innerHTML = `<div style="font-size:11px; color:#777; padding:4px 12px;">Tidak ada lagu ditemukan.</div>`;
                } else {
                    limitedLibrary.forEach(song => {
                        const item = document.createElement('div');
                        item.className = `song-item ${song.originalIndex === currentSongIndex && !isEditing ? 'active' : ''}`;
                        item.onclick = () => { selectSong(song.originalIndex, true); if(window.innerWidth <= 768) toggleMobileSidebar(); };
                        item.innerHTML = `<div class="song-item-title">${song.title}</div><div class="song-item-artist">${song.artist}</div>`;
                        libraryContainer.appendChild(item);
                    });
                }
            }

            renderQueue();
        }

        function renderQueue() {
            const queueContainer = document.getElementById('queueListContainer');
            queueContainer.innerHTML = '';
            document.getElementById('queueCount').innerText = queueList.length + ' lagu';

            if (queueList.length === 0) {
                queueContainer.innerHTML = `<div style="font-size:11px; color:#777; padding:4px 12px;">Belum ada antrean lagu.</div>`;
                return;
            }

            queueList.forEach((songIndex, qIdx) => {
                const song = songList[songIndex];
                if (!song) return;

                const item = document.createElement('div');
                item.className = `song-item ${qIdx === currentQueueIndex && !isEditing ? 'active' : ''}`;
                item.onclick = () => { playQueueIndex(qIdx); if(window.innerWidth <= 768) toggleMobileSidebar(); };
                item.innerHTML = `<div class="song-item-title">${song.title}</div><div class="song-item-artist">${song.artist}</div>`;
                queueContainer.appendChild(item);
            });
        }

        function selectSong(index, addToQueue = true) {
            stopAudio();
            stopAutoScroll();
            isEditing = false;
            currentSongIndex = index;
            currentKeyIndex = 0;
            document.getElementById('keyDisplay').innerText = chordList[currentKeyIndex];
            document.getElementById('contentHeader').style.display = 'flex';

            if (addToQueue) {
                let existingQIndex = queueList.indexOf(index);
                if (existingQIndex !== -1) {
                    currentQueueIndex = existingQIndex;
                } else {
                    queueList.push(index);
                    currentQueueIndex = queueList.length - 1;
                }
            }

            renderSidebar();
            renderPlayer();
            initAudioPlayerForCurrentSong();
        }

        function initAudioPlayerForCurrentSong() {
            const song = songList[currentSongIndex];
            const playerBar = document.getElementById('playerBarContainer');
            document.getElementById('songCurrentTime').innerText = "00:00";
            document.getElementById('songDuration').innerText = "00:00";

            if (!song.audioPath || song.audioPath.trim() === "") {
                playerBar.style.display = 'none';
                audioPlayer.src = "";
                return;
            }

            playerBar.style.display = 'flex';
            let directUrl = parseGoogleDriveUrl(song.audioPath);

            audioPlayer.src = directUrl;
            audioPlayer.load();
            document.getElementById('audioStatusText').innerText = "Siap diputar (GDrive)";

            audioPlayer.onloadedmetadata = function() {
                document.getElementById('songDuration').innerText = formatTime(audioPlayer.duration);
            };

            audioPlayer.onplay = function() {
                document.getElementById('playIcon').className = "fa-solid fa-pause";
                document.getElementById('audioStatusText').innerText = "Memutar dari Google Drive...";
                startSyncLoop();
            };

            audioPlayer.onpause = function() {
                document.getElementById('playIcon').className = "fa-solid fa-play";
                document.getElementById('audioStatusText').innerText = "Dijeda";
                stopSyncLoop();
            };

            audioPlayer.onended = function() {
                playNextQueue();
            };
            
            audioPlayer.onerror = function() {
                document.getElementById('audioStatusText').innerText = "Gagal memuat audio GDrive (Cek izin link / format)";
            };
        }

        function togglePlayMusic() {
            if (!audioPlayer.src) {
                alert('Link audio Google Drive belum diatur!');
                return;
            }

            if (audioPlayer.paused) {
                audioPlayer.play().catch(err => {
                    alert('Gagal memutar audio dari Google Drive. Pastikan akses link diset "Anyone with the link".');
                });
            } else {
                audioPlayer.pause();
            }
        }

        function stopAudio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            stopSyncLoop();
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
        }

        function startSyncLoop() {
            stopSyncLoop();
            syncInterval = setInterval(() => {
                if (audioPlayer.paused) return;
                let currentSec = audioPlayer.currentTime;
                let totalSec = audioPlayer.duration || 1;

                document.getElementById('songCurrentTime').innerText = formatTime(currentSec);

                let wrappers = document.querySelectorAll('.lyric-line-wrapper');
                if (wrappers.length > 0) {
                    let progressRatio = currentSec / totalSec;
                    let targetIndex = Math.floor(progressRatio * wrappers.length);

                    wrappers.forEach((el, idx) => {
                        if (idx === targetIndex) {
                            el.classList.add('active-lyric');
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        } else {
                            el.classList.remove('active-lyric');
                        }
                    });
                }
            }, 500);
        }

        function stopSyncLoop() {
            if (syncInterval) {
                clearInterval(syncInterval);
                syncInterval = null;
            }
        }

        function playQueueIndex(qIdx) {
            if (qIdx >= 0 && qIdx < queueList.length) {
                currentQueueIndex = qIdx;
                selectSong(queueList[qIdx], false);
            }
        }

        function playNextQueue() {
            if (queueList.length === 0) return;
            let nextQIdx = (currentQueueIndex + 1) % queueList.length;
            playQueueIndex(nextQIdx);
        }

        function playPrevQueue() {
            if (queueList.length === 0) return;
            let prevQIdx = (currentQueueIndex - 1 + queueList.length) % queueList.length;
            playQueueIndex(prevQIdx);
        }

        function renderPlayer() {
            if (songList.length === 0) {
                document.getElementById('viewportBody').innerHTML = `<p style="color:#b3b3b3; text-align:center; margin-top:50px;">Belum ada lagu.</p>`;
                return;
            }

            const song = songList[currentSongIndex];
            document.getElementById('displayTitle').innerText = song.title;
            document.getElementById('displayArtist').innerText = song.artist;

            const container = document.getElementById('viewportBody');
            container.innerHTML = '';

            const lines = song.rawText.split('\n');
            let pendingChordLine = '';

            lines.forEach(line => {
                let trimmed = line.trim();
                
                if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
                    let innerContent = trimmed.slice(1, -1).trim();
                    let isSectionTag = /^(intro|verse|chorus|reff|bridge|outro|solo|coda|bait)/i.test(innerContent);
                    
                    if (isSectionTag) {
                        const tag = document.createElement('div');
                        tag.className = 'section-tag';
                        tag.innerText = innerContent;
                        container.appendChild(tag);
                        pendingChordLine = '';
                    } else {
                        pendingChordLine = line.replace(/\[/g, ' ').replace(/\]/g, ' ');
                    }
                } 
                else if (trimmed !== '') {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'lyric-line-wrapper';

                    const chordDiv = document.createElement('div');
                    chordDiv.className = 'chords-row';
                    
                    let processedChord = pendingChordLine ? transposeChordLine(pendingChordLine, currentKeyIndex) : '';
                    if (document.getElementById('numberFormatToggle').checked && processedChord) {
                        processedChord = convertToNashvilleNumbers(processedChord, currentKeyIndex);
                    }
                    chordDiv.innerText = processedChord;

                    const lyricDiv = document.createElement('div');
                    lyricDiv.className = 'lyrics-row';
                    lyricDiv.innerText = line;

                    wrapper.appendChild(chordDiv);
                    wrapper.appendChild(lyricDiv);
                    container.appendChild(wrapper);

                    pendingChordLine = '';
                }
            });

            toggleChords();
        }

        function updateScrollSpeedFromSlider(val) {
            scrollSpeed = parseFloat(val);
            document.getElementById('scrollSpeedDisplay').innerText = scrollSpeed.toFixed(1) + 'x';
        }

        function updateFontSizeFromSlider(val) {
            fontScale = parseFloat(parseFloat(val).toFixed(1));
            document.documentElement.style.setProperty('--font-scale', fontScale);
            document.getElementById('fontSizeDisplay').innerText = Math.round(fontScale * 100) + '%';
        }

        function toggleAutoScroll() {
            if (isScrolling) {
                stopAutoScroll();
            } else {
                startAutoScrollInterval();
            }
        }

        function startAutoScrollInterval() {
            stopAutoScroll();
            isScrolling = true;
            const btn = document.getElementById('btnToggleScroll');
            btn.innerText = 'Berhenti';
            btn.style.background = '#ff4b4b';
            btn.style.color = 'white';

            const viewport = document.getElementById('viewportBody');
            lastScrollTime = performance.now();
            accumulatedScroll = viewport.scrollTop;

            function step(currentTime) {
                if (!isScrolling) return;
                let deltaTime = currentTime - lastScrollTime;
                lastScrollTime = currentTime;

                accumulatedScroll += scrollSpeed * (deltaTime / 16.66) * 0.8;
                viewport.scrollTop = accumulatedScroll;

                if (viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 2) {
                    stopAutoScroll();
                    return;
                }
                animationId = requestAnimationFrame(step);
            }
            animationId = requestAnimationFrame(step);
        }

        function stopAutoScroll() {
            isScrolling = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            const btn = document.getElementById('btnToggleScroll');
            if(btn) {
                btn.innerText = 'Mulai';
                btn.style.background = '#1db954';
                btn.style.color = 'black';
            }
        }

        function toggleFullscreen() {
            const body = document.getElementById('mainBody');
            const btn = document.getElementById('btnFullscreen');
            body.classList.toggle('fullscreen-mode');
            if (body.classList.contains('fullscreen-mode')) {
                btn.innerHTML = '<i class="fa-solid fa-compress"></i>';
                btn.classList.add('active');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-expand"></i>';
                btn.classList.remove('active');
            }
        }

        function showAddForm() {
            stopAudio();
            stopAutoScroll();
            isEditing = true;
            renderSidebar();
            document.getElementById('contentHeader').style.display = 'none';

            const container = document.getElementById('viewportBody');
            container.innerHTML = `
                <div class="form-container">
                    <h2>Tambah Lagu & Link Google Drive</h2>
                    <div class="form-group">
                        <label>Judul Lagu</label>
                        <input type="text" id="inputTitle" placeholder="Misal: Here Again">
                    </div>
                    <div class="form-group">
                        <label>Nama Artis / Penyanyi</label>
                        <input type="text" id="inputArtist" placeholder="Misal: Elevation Worship">
                    </div>
                    <div class="form-group">
                        <label>Link Audio (Tempel Link Google Drive di sini)</label>
                        <input type="text" id="inputAudioPath" placeholder="https://drive.google.com/file/d/.../view">
                    </div>
                    <div class="form-group">
                        <label>Format Lirik & Chord</label>
                        <textarea id="inputRaw" placeholder="[Verse 1]&#10;[C     G/B   Am]&#10;Can't go back..."></textarea>
                    </div>
                    <div class="form-buttons">
                        <button class="btn-submit" onclick="saveNewSong()">Simpan Lagu</button>
                        <button class="btn-cancel" onclick="selectSong(0, false)">Batal</button>
                    </div>
                </div>
            `;
        }

        function showEditForm() {
            stopAudio();
            stopAutoScroll();
            isEditing = true;
            renderSidebar();
            document.getElementById('contentHeader').style.display = 'none';

            const song = songList[currentSongIndex];

            const container = document.getElementById('viewportBody');
            container.innerHTML = `
                <div class="form-container">
                    <h2>Edit Lagu & Link Google Drive</h2>
                    <div class="form-group">
                        <label>Judul Lagu</label>
                        <input type="text" id="inputTitle" value="${song.title}">
                    </div>
                    <div class="form-group">
                        <label>Nama Artis / Penyanyi</label>
                        <input type="text" id="inputArtist" value="${song.artist}">
                    </div>
                    <div class="form-group">
                        <label>Link Audio (Tempel Link Google Drive di sini)</label>
                        <input type="text" id="inputAudioPath" value="${song.audioPath || ''}" placeholder="https://drive.google.com/file/d/.../view">
                    </div>
                    <div class="form-group">
                        <label>Format Lirik & Chord</label>
                        <textarea id="inputRaw">${song.rawText}</textarea>
                    </div>
                    <div class="form-buttons">
                        <button class="btn-submit" onclick="updateSong()">Simpan Perubahan</button>
                        <button class="btn-cancel" onclick="selectSong(${currentSongIndex}, false)">Batal</button>
                        <button class="btn-delete" onclick="deleteSong()">Hapus Lagu</button>
                    </div>
                </div>
            `;
        }

        function saveNewSong() {
            const title = document.getElementById('inputTitle').value.trim();
            const artist = document.getElementById('inputArtist').value.trim();
            const audioPath = document.getElementById('inputAudioPath').value.trim();
            const rawText = document.getElementById('inputRaw').value.trim();

            if (!title || !rawText) {
                alert('Judul dan lirik wajib diisi!');
                return;
            }

            songList.push({ 
                title, 
                artist: artist || 'Unknown Artist', 
                audioPath, 
                rawText 
            });
            localStorage.setItem('web_saved_songs', JSON.stringify(songList));
            selectSong(songList.length - 1, true);
        }

        function updateSong() {
            const title = document.getElementById('inputTitle').value.trim();
            const artist = document.getElementById('inputArtist').value.trim();
            const audioPath = document.getElementById('inputAudioPath').value.trim();
            const rawText = document.getElementById('inputRaw').value.trim();

            if (!title || !rawText) {
                alert('Judul dan lirik wajib diisi!');
                return;
            }

            songList[currentSongIndex] = { 
                title, 
                artist: artist || 'Unknown Artist', 
                audioPath, 
                rawText 
            };
            localStorage.setItem('web_saved_songs', JSON.stringify(songList));
            selectSong(currentSongIndex, false);
        }

        function deleteSong() {
            if (confirm('Apakah Anda yakin ingin menghapus lagu ini?')) {
                songList.splice(currentSongIndex, 1);
                localStorage.setItem('web_saved_songs', JSON.stringify(songList));
                queueList = queueList.filter(idx => idx !== currentSongIndex).map(idx => idx > currentSongIndex ? idx - 1 : idx);
                currentSongIndex = songList.length > 0 ? 0 : null;
                if (currentSongIndex !== null) {
                    selectSong(0, false);
                } else {
                    isEditing = false;
                    document.getElementById('contentHeader').style.display = 'none';
                    renderSidebar();
                    document.getElementById('viewportBody').innerHTML = `<p style="color:#b3b3b3; text-align:center; margin-top:50px;">Belum ada lagu.</p>`;
                }
            }
        }

        function transpose(step) {
            currentKeyIndex = (currentKeyIndex + step + chordList.length) % chordList.length;
            document.getElementById('keyDisplay').innerText = chordList[currentKeyIndex];
            renderPlayer();
        }

        function transposeChordLine(chordLine, semitones) {
            if (!chordLine) return '';
            return chordLine.replace(/[A-G][#b]?(m|7|maj7|dim|sus4|2|4)?(\/[A-G][#b]?)?/g, function(match) {
                if (match.includes('/')) {
                    let parts = match.split('/');
                    return translateSingleChord(parts[0], semitones) + '/' + translateSingleChord(parts[1], semitones);
                }
                return translateSingleChord(match, semitones);
            });
        }

        function translateSingleChord(chordStr, semitones) {
            let root = chordStr.replace(/m|7|maj7|dim|sus4|2|4/g, '');
            let modifier = chordStr.replace(root, '');
            let index = chordList.indexOf(root);
            if (index === -1) return chordStr;
            let newIndex = (index + semitones + chordList.length) % chordList.length;
            return chordList[newIndex] + modifier;
        }

        function convertToNashvilleNumbers(chordLine, keyIdx) {
            if (!chordLine) return '';
            const majorScaleIntervals = [0, 2, 4, 5, 7, 9, 11];
            const nashvilleNumbers = ['1', '2', '3', '4', '5', '6', '7'];
            const naturalIsMinor = [false, true, true, false, false, true, true];

            return chordLine.replace(/[A-G][#b]?(m|7|maj7|dim|sus4|2|4)?(\/[A-G][#b]?)?/g, function(match) {
                if (match.includes('/')) {
                    let parts = match.split('/');
                    return convertSingleToNumber(parts[0], keyIdx, majorScaleIntervals, nashvilleNumbers, naturalIsMinor) + '/' + 
                           convertSingleToNumber(parts[1], keyIdx, majorScaleIntervals, nashvilleNumbers, naturalIsMinor);
                }
                return convertSingleToNumber(match, keyIdx, majorScaleIntervals, nashvilleNumbers, naturalIsMinor);
            });
        }

        function convertSingleToNumber(chordStr, keyIdx, intervals, numbers, naturalIsMinor) {
            let root = chordStr.replace(/m|7|maj7|dim|sus4|2|4/g, '');
            let modifier = chordStr.replace(root, '');
            let rootIdx = chordList.indexOf(root);
            if (rootIdx === -1) return chordStr;

            let semitoneDiff = (rootIdx - keyIdx + 12) % 12;
            let scaleIndex = intervals.indexOf(semitoneDiff);

            let numberBase = (scaleIndex !== -1) ? numbers[scaleIndex] : (numbers[intervals.findIndex(i => semitoneDiff <= i) || 0] + '♯/♭');

            if (scaleIndex !== -1) {
                let isNaturallyMinor = naturalIsMinor[scaleIndex];
                let isCurrentlyMinor = modifier.includes('m') && !modifier.includes('maj');
                if (isNaturallyMinor && !isCurrentlyMinor) modifier = 'M' + modifier.replace('m', '');
                else modifier = modifier.replace('m', '');
                if (isCurrentlyMinor) modifier = 'm' + modifier;
            }
            return numberBase + modifier;
        }

        function toggleChords() {
            const body = document.getElementById('mainBody');
            if (document.getElementById('chordToggle').checked) {
                body.classList.remove('hide-chords');
            } else {
                body.classList.add('hide-chords');
            }
        }

        window.onload = function() {
            if (songList.length > 0) {
                selectSong(0, true);
            }
        };
    </script>
</body>
</html>
