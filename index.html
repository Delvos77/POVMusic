<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Chord Gitar</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #3b82f6;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Accordion Style */
        .chord-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .chord-header {
            padding: 1rem;
            background-color: var(--primary-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .chord-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 1rem;
            background-color: var(--card-bg);
        }

        .chord-card.active .chord-content {
            max-height: 1000px;
            padding: 1rem;
            transition: max-height 0.5s ease-in;
        }

        pre {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .chord-text {
            color: var(--accent-color);
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Chord & Lirik Lagu</h1>
    </header>

    <div class="container" id="song-container">
        <div class="loading">Memuat daftar lagu...</div>
    </div>

    <!-- Firebase & Main Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAkZBMA-K5LxNWyMiwZMp7Upbgtar4rJZU",
            authDomain: "music-c-b3dfa.firebaseapp.com",
            projectId: "music-c-b3dfa",
            storageBucket: "music-c-b3dfa.firebasestorage.app",
            messagingSenderId: "674465686946",
            appId: "1:674465686946:web:37dee28607362fd3ac7efb",
            measurementId: "G-WKQEMCQ9D8"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        // Fungsi untuk mengambil data lagu dari Realtime Database
        async function loadSongs() {
            const container = document.getElementById('song-container');
            try {
                const songsRef = ref(db, 'songs'); // Pastikan struktur node di database Anda bernama 'songs'
                const snapshot = await get(songsRef);

                if (snapshot.exists()) {
                    container.innerHTML = '';
                    const songs = snapshot.val();

                    Object.keys(songs).forEach(key => {
                        const song = songs[key];
                        
                        // Membuat elemen Accordion untuk setiap lagu
                        const card = document.createElement('div');
                        card.className = 'chord-card';

                        card.innerHTML = `
                            <div class="chord-header">
                                <span>${song.title} - ${song.artist}</span>
                                <span>▼</span>
                            </div>
                            <div class="chord-content">
                                <pre>${song.lyrics}</pre>
                            </div>
                        `;

                        // Event listener untuk membuka/menutup accordion
                        const header = card.querySelector('.chord-header');
                        header.addEventListener('click', () => {
                            card.classList.toggle('active');
                            const icon = header.querySelector('span:last-child');
                            icon.textContent = card.classList.contains('active') ? '▲' : '▼';
                        });

                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div class="loading">Belum ada data lagu di database.</div>';
                }
            } catch (error) {
                console.error("Gagal memuat data:", error);
                container.innerHTML = '<div class="loading">Gagal memuat lagu dari server.</div>';
            }
        }

        // Jalankan saat halaman dimuat
        loadSongs();
    </script>
</body>
</html>
