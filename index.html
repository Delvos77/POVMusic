<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Chord Gitar Real-time</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; padding-bottom: 80px; }
        #playerBar { display: flex; align-items: center; gap: 10px; padding: 10px; background: #eee; position: fixed; bottom: 0; left: 0; width: 100%; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; background: #f9f9f9; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <h1>Daftar Lagu (Real-time Sync)</h1>
    <ul id="songListContainer"></ul>

    <!-- Pemutar Musik -->
    <div id="playerBar" style="display:none;">
        <audio id="audioPlayer" controls></audio>
    </div>

    <script type="module">
        // Import Firebase SDK menggunakan CDN modular
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // Konfigurasi Firebase dari akun kamu
        const firebaseConfig = {
            apiKey: "AIzaSyAkZBMA-K5LxNwYMiwZMp7UpbgtaR4rJZU",
            authDomain: "music-c-b3dfa.firebaseapp.com",
            databaseURL: "https://music-c-b3dfa-default-rtdb.asia-southeast1.firebasedatabase.app", // Sesuaikan dengan URL Realtime Database kamu
            projectId: "music-c-b3dfa",
            storageBucket: "music-c-b3dfa.firebasestorage.app",
            messagingSenderId: "674465686946",
            appId: "1:674465686946:web:37dee28607362fd3ac7efb",
            measurementId: "G-WKQEMCQ9D8"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let songList = [];

        // 1. Ambil data secara real-time dari Firebase
        const songsRef = ref(db, 'songs/');
        onValue(songsRef, (snapshot) => {
            const data = snapshot.val();
            songList = data ? Object.values(data) : [];
            renderSongList();
        });

        // 2. Fungsi untuk menampilkan daftar lagu ke layar
        function renderSongList() {
            const container = document.getElementById('songListContainer');
            container.innerHTML = '';
            
            if (songList.length === 0) {
                container.innerHTML = '<li>Belum ada lagu di database.</li>';
                return;
            }

            songList.forEach((song, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span><b>${song.title}</b> - ${song.artist || ''}</span> <button onclick="playSong(${index})">Play</button>`;
                container.appendChild(li);
            });
        }

        // 3. Fungsi Play Lagu
        window.playSong = function(index) {
            const song = songList[index];
            const playerBar = document.getElementById('playerBar');
            const audioPlayer = document.getElementById('audioPlayer');

            if (song.audioPath) {
                playerBar.style.display = 'flex';
                audioPlayer.src = song.audioPath;
                audioPlayer.play();
            } else {
                alert("Link audio tidak tersedia!");
            }
        };
    </script>
</body>
</html>
